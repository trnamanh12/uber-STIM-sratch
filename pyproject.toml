[project]
name = "uber-mobility-engine"
version = "0.1.0"
description = "Autonomous Uber Mobility Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
